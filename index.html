<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <title>Night Shift - Horror 2D</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; } html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; color: white; } button { touch-action: manipulation; cursor: pointer; } #game { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050505; } /* ESCRITÓRIO */ #office { position: absolute; inset: 0; background: linear-gradient(#181818 0%, #0b0b0b 60%, #020202 100%); } .wall { position: absolute; top: 0; width: 100%; height: 65%; background: repeating-linear-gradient( 90deg, #181818 0, #181818 50px, #101010 51px, #101010 100px ); } .floor { position: absolute; bottom: 0; width: 100%; height: 35%; background: repeating-linear-gradient( 45deg, #171717 0, #171717 35px, #0c0c0c 36px, #0c0c0c 70px ); } /* CORREDORES */ .hall { position: absolute; top: 15%; width: 22%; height: 58%; background: #010101; border: 4px solid #222; overflow: hidden; } .leftHall { left: 0; } .rightHall { right: 0; } .light { position: absolute; inset: 0; background: radial-gradient( ellipse, rgba(255,255,210,.4), rgba(255,255,210,.05) 45%, transparent 75% ); opacity: 0; transition: opacity .15s; } .light.on { opacity: 1; } /* PORTAS */ .door { position: absolute; inset: 0; background: repeating-linear-gradient( #333 0, #333 18px, #181818 19px, #181818 36px ); transform: translateY(-105%); transition: transform .3s; z-index: 5; } .door.closed { transform: translateY(0); } /* MESA */ .desk { position: absolute; width: 48%; height: 18%; left: 26%; bottom: 12%; background: #151515; border: 4px solid #292929; box-shadow: 0 0 30px #000; } .monitor { position: absolute; width: 22%; height: 18%; left: 39%; bottom: 27%; background: #030303; border: 5px solid #292929; } /* CONTROLES */ .control { position: absolute; top: 40%; width: 85px; padding: 8px; background: #111; border: 2px solid #444; z-index: 50; text-align: center; } .control.left { left: 22%; } .control.right { right: 22%; } .control-title { font-size: 12px; margin-bottom: 5px; } .control button { display: block; width: 100%; height: 45px; margin: 5px 0; color: white; background: #222; border: 2px solid #666; font-weight: bold; } .control button:active { transform: scale(.94); } .control button.active { background: #9b1111; border-color: #ff4444; } /* HUD */ #hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 100; font-weight: bold; text-shadow: 0 2px 5px #000; } #power { color: #6cff6c; } #time { font-size: 24px; } /* CÂMERA */ #cameraButton { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 100; width: 180px; height: 55px; color: white; background: #222; border: 3px solid #777; font-size: 16px; font-weight: bold; } #cameraButton:active { transform: translateX(-50%) scale(.94); } #cameraPanel { position: absolute; inset: 0; z-index: 200; display: none; background: rgba(0,0,0,.96); } #cameraPanel.open { display: block; } .cameraView { position: absolute; top: 5%; left: 3%; width: 68%; height: 72%; border: 4px solid #555; background: radial-gradient(circle, #333, #080808 75%); overflow: hidden; } #camTitle { position: absolute; top: 15px; left: 15px; font-size: 18px; z-index: 3; } #camDescription { position: absolute; bottom: 15px; left: 15px; color: #aaa; z-index: 3; } .noise { position: absolute; inset: 0; opacity: .15; background: repeating-linear-gradient( 0deg, transparent 0, transparent 3px, white 4px ); pointer-events: none; } .camButtons { position: absolute; top: 8%; right: 3%; width: 25%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .camButtons button { height: 55px; color: white; background: #1b1b1b; border: 2px solid #666; font-weight: bold; } .camButtons button:active { background: #555; transform: scale(.94); } #closeCam { position: absolute; right: 4%; bottom: 10%; width: 25%; height: 55px; color: white; background: #751414; border: 2px solid #d44; font-weight: bold; } /* INIMIGO */ .enemy { display: none; position: absolute; width: 120px; height: 200px; left: 50%; top: 25%; transform: translateX(-50%); z-index: 2; } .enemy.show { display: block; } .enemyHead { position: absolute; width: 100px; height: 100px; left: 10px; border-radius: 50%; background: #454545; box-shadow: 0 0 30px #000; } .eye { position: absolute; top: 35px; width: 18px; height: 18px; border-radius: 50%; background: red; box-shadow: 0 0 12px red; } .eye.left { left: 20px; } .eye.right { right: 20px; } .enemyMouth { position: absolute; left: 22px; bottom: 15px; width: 56px; height: 25px; background: #050505; } /* JUMPSCARE */ #jumpscare { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 900; background: #200000; } #jumpscare.show { display: flex; animation: shake .06s infinite; } .scareFace { width: 65vw; height: 65vw; max-width: 500px; max-height: 500px; border-radius: 45%; background: #555; box-shadow: 0 0 100px red; position: relative; } .scareEye { position: absolute; top: 25%; width: 25%; height: 25%; background: red; border-radius: 50%; } .scareEye.left { left: 14%; } .scareEye.right { right: 14%; } .scareMouth { position: absolute; left: 15%; bottom: 15%; width: 70%; height: 25%; background: #000; } @keyframes shake { 0% { transform: translate(0); } 25% { transform: translate(10px,-10px); } 50% { transform: translate(-10px,10px); } 75% { transform: translate(10px,10px); } 100% { transform: translate(-10px,-10px); } } /* TELAS */ .screen { position: absolute; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; background: #000; } .screen.show { display: flex; } .screen h1 { font-size: 42px; margin-bottom: 20px; } .restart { margin-top: 20px; padding: 15px 30px; color: white; background: #222; border: 2px solid #777; font-size: 18px; } /* CELULAR */ @media(max-width:700px) { .control { width: 65px; } .control.left { left: 20%; } .control.right { right: 20%; } .control button { height: 38px; font-size: 10px; } .cameraView { width: 70%; height: 68%; } .camButtons { width: 25%; } .camButtons button { height: 48px; font-size: 10px; } #closeCam { height: 48px; font-size: 11px; } } </style> </head> <body> <div id="game"> <!-- ESCRITÓRIO --> <div id="office"> <div class="wall"></div> <div class="floor"></div> <div class="hall leftHall"> <div id="leftLight" class="light"></div> <div id="leftDoor" class="door"></div> </div> <div class="hall rightHall"> <div id="rightLight" class="light"></div> <div id="rightDoor" class="door"></div> </div> <div class="desk"></div> <div class="monitor"></div> <!-- CONTROLE ESQUERDO --> <div class="control left"> <div class="control-title">ESQUERDA</div> <button id="leftDoorBtn"> PORTA </button> <button id="leftLightBtn"> LUZ </button> </div> <!-- CONTROLE DIREITO --> <div class="control right"> <div class="control-title">DIREITA</div> <button id="rightDoorBtn"> PORTA </button> <button id="rightLightBtn"> LUZ </button> </div> </div> <!-- HUD --> <div id="hud"> <div> ENERGIA: <span id="power">100%</span> <br> USO: <span id="usage">▮</span> </div> <div id="time"> 12 AM </div> </div> <!-- BOTÃO CÂMERA --> <button id="cameraButton"> 📹 CÂMERAS </button> <!-- CÂMERAS --> <div id="cameraPanel"> <div class="cameraView"> <div id="camTitle"> CAM 1 </div> <div id="camDescription"> Nada parece estar se movendo... </div> <div id="cameraEnemy" class="enemy"> <div class="enemyHead"> <div class="eye left"></div> <div class="eye right"></div> <div class="enemyMouth"></div> </div> </div> <div class="noise"></div> </div> <div class="camButtons"> <button data-cam="1">CAM 1</button> <button data-cam="2">CAM 2</button> <button data-cam="3">CAM 3</button> <button data-cam="4">CAM 4</button> <button data-cam="5">CAM 5</button> <button data-cam="6">CAM 6</button> </div> <button id="closeCam"> FECHAR CÂMERAS </button> </div> <!-- JUMPSCARE --> <div id="jumpscare"> <div class="scareFace"> <div class="scareEye left"></div> <div class="scareEye right"></div> <div class="scareMouth"></div> </div> </div> <!-- MORTE --> <div id="gameOver" class="screen"> <h1>VOCÊ MORREU</h1> <p>O animatrônico encontrou você.</p> <button class="restart" onclick="location.reload()"> TENTAR NOVAMENTE </button> </div> <!-- VITÓRIA --> <div id="winScreen" class="screen"> <h1>6 AM</h1> <p>Você sobreviveu à noite!</p> <button class="restart" onclick="location.reload()"> JOGAR NOVAMENTE </button> </div> </div> <script> let power = 100; let hour = 0; let gameOver = false; let camerasOpen = false; let currentCam = 1; let enemyPosition = 0; const doors = { left: false, right: false }; const lights = { left: false, right: false }; /* ELEMENTOS */ const powerText = document.getElementById("power"); const timeText = document.getElementById("time"); const usageText = document.getElementById("usage"); const leftDoor = document.getElementById("leftDoor"); const rightDoor = document.getElementById("rightDoor"); const leftLight = document.getElementById("leftLight"); const rightLight = document.getElementById("rightLight"); const leftDoorBtn = document.getElementById("leftDoorBtn"); const rightDoorBtn = document.getElementById("rightDoorBtn"); const leftLightBtn = document.getElementById("leftLightBtn"); const rightLightBtn = document.getElementById("rightLightBtn"); const cameraButton = document.getElementById("cameraButton"); const closeCam = document.getElementById("closeCam"); const cameraPanel = document.getElementById("cameraPanel"); const cameraEnemy = document.getElementById("cameraEnemy"); const camTitle = document.getElementById("camTitle"); const camDescription = document.getElementById("camDescription"); /* FUNÇÃO PARA CLIQUE + CELULAR */ function addButton(button, action) { button.addEventListener("click", function(event) { event.preventDefault(); action(); }); } /* PORTA ESQUERDA */ addButton(leftDoorBtn, function() { if (gameOver || power <= 0) return; doors.left = !doors.left; leftDoor.classList.toggle( "closed", doors.left ); leftDoorBtn.classList.toggle( "active", doors.left ); updateUsage(); }); /* PORTA DIREITA */ addButton(rightDoorBtn, function() { if (gameOver || power <= 0) return; doors.right = !doors.right; rightDoor.classList.toggle( "closed", doors.right ); rightDoorBtn.classList.toggle( "active", doors.right ); updateUsage(); }); /* LUZ ESQUERDA */ addButton(leftLightBtn, function() { if (gameOver || power <= 0) return; lights.left = !lights.left; leftLight.classList.toggle( "on", lights.left ); leftLightBtn.classList.toggle( "active", lights.left ); if (lights.left) { setTimeout(function() { lights.left = false; leftLight.classList.remove("on"); leftLightBtn.classList.remove("active"); }, 1500); } updateUsage(); }); /* LUZ DIREITA */ addButton(rightLightBtn, function() { if (gameOver || power <= 0) return; lights.right = !lights.right; rightLight.classList.toggle( "on", lights.right ); rightLightBtn.classList.toggle( "active", lights.right ); if (lights.right) { setTimeout(function() { lights.right = false; rightLight.classList.remove("on"); rightLightBtn.classList.remove("active"); }, 1500); } updateUsage(); }); /* CÂMERA */ addButton(cameraButton, function() { if (gameOver || power <= 0) return; camerasOpen = true; cameraPanel.classList.add("open"); updateCamera(); updateUsage(); }); /* FECHAR CÂMERA */ addButton(closeCam, function() { camerasOpen = false; cameraPanel.classList.remove("open"); updateUsage(); }); /* BOTÕES DAS CÂMERAS */ document.querySelectorAll(".camButtons button") .forEach(function(button) { addButton(button, function() { currentCam = Number(button.dataset.cam); updateCamera(); }); }); /* ATUALIZAR CÂMERA */ function updateCamera() { const names = { 1: "SALÃO", 2: "CORREDOR ESQUERDO", 3: "CORREDOR DIREITO", 4: "DEPÓSITO", 5: "PALCO", 6: "SALA DOS FUNDOS" }; camTitle.textContent = "CAM " + currentCam + " — " + names[currentCam]; const enemyCam = getEnemyCamera(); if (currentCam === enemyCam) { cameraEnemy.classList.add("show"); camDescription.textContent = "⚠️ MOVIMENTO DETECTADO!"; } else { cameraEnemy.classList.remove("show"); camDescription.textContent = "Nenhum movimento detectado..."; } } /* ROTA DO INIMIGO */ function getEnemyCamera() { const route = [5, 1, 4, 2, 3]; return route[ Math.min( enemyPosition, route.length - 1 ) ]; } /* MOVIMENTO DO INIMIGO */ function moveEnemy() { if (gameOver) return; if (Math.random() < 0.40) { enemyPosition++; if (enemyPosition >= 4) { attack(); return; } } if (camerasOpen) { updateCamera(); } } /* ATAQUE */ function attack() { const side = Math.random() < 0.5 ? "left" : "right"; if (doors[side]) { enemyPosition = Math.max( 1, enemyPosition - 2 ); return; } jumpscare(); } /* JUMPSCARE */ function jumpscare() { if (gameOver) return; gameOver = true; cameraPanel.classList.remove("open"); document .getElementById("jumpscare") .classList.add("show"); setTimeout(function() { document .getElementById("jumpscare") .classList.remove("show"); document .getElementById("gameOver") .classList.add("show"); }, 1800); } /* ENERGIA */ function drainPower() { if (gameOver) return; let drain = 0.12; if (doors.left) drain += 0.08; if (doors.right) drain += 0.08; if (lights.left) drain += 0.04; if (lights.right) drain += 0.04; if (camerasOpen) drain += 0.05; power -= drain; power = Math.max(0, power); powerText.textContent = Math.floor(power) + "%"; updateUsage(); if (power <= 0) { doors.left = false; doors.right = false; leftDoor.classList.remove("closed"); rightDoor.classList.remove("closed"); leftDoorBtn.classList.remove("active"); rightDoorBtn.classList.remove("active"); cameraPanel.classList.remove("open"); camerasOpen = false; setTimeout(function() { if (!gameOver) { jumpscare(); } }, 3000); } } /* USO */ function updateUsage() { let usage = 1; if (doors.left) usage++; if (doors.right) usage++; if (lights.left) usage++; if (lights.right) usage++; if (camerasOpen) usage++; usageText.textContent = "▮".repeat( Math.min(usage, 6) ); } /* RELÓGIO */ function updateTime() { if (gameOver) return; hour++; if (hour >= 6) { gameOver = true; document .getElementById("winScreen") .classList.add("show"); return; } timeText.textContent = (hour === 0 ? 12 : hour) + " AM"; } /* TECLADO */ document.addEventListener("keydown", function(event) { if (event.key === "q") leftDoorBtn.click(); if (event.key === "a") leftLightBtn.click(); if (event.key === "e") rightDoorBtn.click(); if (event.key === "d") rightLightBtn.click(); if (event.key === " ") cameraButton.click(); }); /* GAME LOOP */ setInterval(function() { drainPower(); moveEnemy(); }, 5000); setInterval(function() { updateTime(); }, 20000); updateUsage(); updateCamera(); </script> </body> </html>
